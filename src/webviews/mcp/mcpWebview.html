<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Servers</title>
    <link href="{{styleUri}}" rel="stylesheet">
</head>

<body>
    <header class="mcp-header">
        <div class="header-left">
            <div class="stat-pill">Servers: <strong id="activeServers">0</strong>/<span id="totalServers">0</span></div>
            <div class="stat-pill">Tools: <strong id="activeTools">0</strong>/<span id="totalTools">0</span></div>
        </div>

        <div class="header-right">
            <div id="addServerContainer">
                <button id="addServerBtn" class="action-index-btn state-unindexed" title="Add new MCP Server">
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span>Add Server</span>
                </button>

                <div class="dropdown-list hidden" id="addServerDropdown">

                    <div class="dropdown-body">
                        <div class="form-group">
                            <label for="serverName">Server Name *</label>
                            <input type="text" id="serverName" placeholder="e.g., local-agent" autocomplete="off">
                        </div>

                        <div class="form-group">
                            <label for="transportType">Transport Type</label>
                            <select id="transportType">
                                <option value="stdio">Stdio</option>
                                <option value="sse">SSE</option>
                            </select>
                        </div>

                        <div id="stdioFields">
                            <div class="form-group">
                                <label for="command">Command *</label>
                                <input type="text" id="command" placeholder="e.g., npx -y @modelcontextprotocol/server-everything">
                            </div>
                            <div class="form-group">
                                <label for="cwd">Working Directory (CWD)</label>
                                <input type="text" id="cwd" placeholder="/path/to/dir">
                            </div>
                            <div class="form-group">
                                <label for="env">Environment (JSON)</label>
                                <textarea id="env" rows="2" placeholder='{"API_KEY": "your-key"}'></textarea>
                            </div>
                        </div>

                        <div id="sseFields" class="hidden">
                            <div class="form-group">
                                <label for="url">URL *</label>
                                <input type="text" id="url" placeholder="http://localhost:3000/sse">
                            </div>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="autoConnect" checked>
                            <label for="autoConnect">Auto-connect after adding</label>
                        </div>
                    </div>

                    <div class="dropdown-footer">
                        <button id="cancelServerBtn" class="secondary-btn">Cancel</button>
                        <button id="saveServerBtn" class="primary-btn" disabled>Save</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="mcp-server-list"></main>

    <script src="{{scriptUri}}"></script>
</body>

</html>
