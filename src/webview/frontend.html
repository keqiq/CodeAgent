<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">

</head>

<body>
    <div class="chat-header">
        <div class="header-left">
            <button id="indexBtn" class="header-action-btn" title="Toggle Index Controls">
                <span id="indexDot" class="status-dot disabled"></span>
                <span id="indexStatus">Disabled</span>
            </button>

            <div id="indexControls" class="header-controls hidden">

                <div class="custom-dropdown" id="embedProviderDropdown">
                    <button class="dropdown-trigger provider-op" type="button">
                        <span class="selected-text">Provider...</span>
                    </button>
                    <div class="dropdown-list hidden"></div>
                </div>

                <span class="divider">|</span>

                <div class="custom-dropdown" id="embedModelDropdown">
                    <button class="dropdown-trigger model-op" type="button" disabled>
                        <span class="selected-text">Models...</span>
                    </button>
                    <div class="dropdown-list hidden"></div>
                </div>
            </div>
        </div>

        <div class="header-right">

            <button id="actionIndexBtn" class="action-index-btn state-unindexed" disabled>
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path
                        d="M8 2c-3.31 0-6 1.34-6 3v6c0 1.66 2.69 3 6 3s6-1.34 6-3V5c0-1.66-2.69-3-6-3zm0 2c2.62 0 4.28.84 4.8 1.5-.52.66-2.18 1.5-4.8 1.5s-4.28-.84-4.8-1.5C3.72 4.84 5.38 4 8 4zm-4.8 4.23c1.07.83 2.79 1.27 4.8 1.27s3.73-.44 4.8-1.27V9.5c-.52.66-2.18 1.5-4.8 1.5s-4.28-.84-4.8-1.5V8.23zm0 3c1.07.83 2.79 1.27 4.8 1.27s3.73-.44 4.8-1.27V12.5c-.52.66-2.18 1.5-4.8 1.5s-4.28-.84-4.8-1.5v-1.27z" />
                </svg>
                <span id="actionIndexBtnText">Index</span>
            </button>

            <div class="settings-menu-wrapper" id="indexSettingsContainer">
                <button id="indexSettingsBtn" class="header-settings-btn" title="Index Settings">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M2 3.5h12v1H2v-1zm0 4h12v1H2v-1zm0 4h12v1H2v-1z" />
                    </svg>
                </button>

                <div class="dropdown-list hidden" id="indexSettingsDropdown">
                    <div class="menu-item number-input">
                        <div class="menu-item-text">
                            <div class="menu-item-title">Retrieval Count</div>
                            <div class="menu-item-desc">Vectors per retrieval.</div>
                        </div>

                        <div class="number-control">
                            <button type="button" id="vectorCountMinus" class="icon-btn" title="Decrease">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M10.4 12.4L6.1 8l4.3-4.4-.7-.7L4.7 8l5 5.1.7-.7z" />
                                </svg>
                            </button>
                            <input type="number" id="vectorCountInput" value="5" min="1">
                            <button type="button" id="vectorCountPlus" class="icon-btn" title="Increase">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M5.6 3.6L9.9 8l-4.3 4.4.7.7L11.3 8l-5-5.1-.7.7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item number-input">
                        <div class="menu-item-text">
                            <div class="menu-item-title">Debounce Time</div>
                            <div class="menu-item-desc">Reindexing timer (Seconds).</div>
                        </div>

                        <div class="number-control">
                            <button type="button" id="debounceTimeMinus" class="icon-btn" title="Decrease">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M10.4 12.4L6.1 8l4.3-4.4-.7-.7L4.7 8l5 5.1.7-.7z" />
                                </svg>
                            </button>
                            <input type="number" id="debounceTimeInput" value="10" min="0">
                            <button type="button" id="debounceTimePlus" class="icon-btn" title="Increase">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M5.6 3.6L9.9 8l-4.3 4.4.7.7L11.3 8l-5-5.1-.7.7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item disabled" id="menuEmbedKeyBtn">
                        Set API Key
                    </div>

                    <div class="inlineAPIKeyContainer hidden" id="embedKeyContainer">
                        <input type="password" id="embedKeyInput" placeholder="sk-..." autocomplete="off">
                        <button id="embedKeySaveBtn" class="send-btn">Save</button>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item active" id="menuIndexToggle">
                        <div class="menu-item-title">Enable Indexing</div>
                        <div class="menu-item-desc">Allow vector embedding semantic search.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- <button id="clearChatBtn" class="icon-btn" title="Clear Chat History">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M10 3h3v1h-1v9l-1 1H4l-1-1V4H2V3h3V2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zM9 2H6v1h3V2zM4 13h7V4H4v9zm2-8H5v7h1V5zm1 0h1v7H7V5zm2 0h1v7H9V5z" />
            </svg>
        </button>

        <div id="clearConfirmContainer" class="floating-confirm">
            <label style="font-size: 11px; font-weight: bold; text-align: center; color: var(--vscode-foreground);">Clear all history?</label>
            <div class="api-key-row">
                <button id="cancelClearBtn" class="send-btn" style="flex: 1; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); justify-content: center;">Cancel</button>
                <button id="confirmClearBtn" class="send-btn" style="flex: 1; background: var(--vscode-errorForeground); color: white; justify-content: center;">Clear</button>
            </div>
        </div> -->
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <button id="scrollToBottomBtn" class="scroll-bottom-btn" title="Scroll to bottom">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 11L3 6l.7-.7L8 9.6l4.3-4.3.7.7L8 11z" />
        </svg>
    </button>

    <div class="chat-input">
        <div class="unified-box">

            <div class="input-row">
                <textarea id="prompt" rows="1" placeholder="Select Provider..."></textarea>
                <button id="actionBtn" class="send-btn" disabled>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 1L1 8h5v7h4V8h5L8 1z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="box-actions">
            <div class="action-group">
                <div class="custom-dropdown" id="providerDropdown">
                    <button class="dropdown-trigger provider-op" type="button" id="providerTrigger">
                        <span class="selected-text">Provider...</span>
                    </button>
                    <div class="dropdown-list hidden" id="providerList"></div>
                </div>

                <span class="divider">|</span>

                <div class="custom-dropdown" id="modelDropdown">
                    <button class="dropdown-trigger model-op" type="button" id="modelTrigger" disabled>
                        <span class="selected-text">Models...</span>
                    </button>
                    <div class="dropdown-list hidden" id="modelList"></div>
                </div>

                <span class="divider hidden" id="effortDivider">|</span>

                <div class="custom-dropdown effort-dropdown hidden" id="effortDropdown">
                    <button class="dropdown-trigger effort-op" type="button" id="effortTrigger">
                        <span class="selected-text">Effort</span>
                    </button>
                    <div class="dropdown-list hidden" id="effortList"></div>
                </div>
            </div>

            <div class="settings-menu-wrapper" id="chatSettingsContainer">
                <button id="chatSettingsToggleBtn" class="icon-btn" title="Model Settings">Settings</button>

                <div class="dropdown-list hidden" id="chatSettingsDropdown">
                    <div class="menu-item number-input" id="menuMaxTurns">
                        <div class="menu-item-text">
                            <div class="menu-item-title">Max turns</div>
                            <div class="menu-item-desc">Set 0 to disable turn limit.</div>
                        </div>

                        <div class="number-control" id="maxTurnsControl">
                            <button type="button" id="maxTurnsMinus" class="icon-btn" title="Decrease">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M10.4 12.4L6.1 8l4.3-4.4-.7-.7L4.7 8l5 5.1.7-.7z" />
                                </svg>
                            </button>
                            <input type="number" id="maxTurnsInput" value="0" min="0">
                            <button type="button" id="maxTurnsPlus" class="icon-btn" title="Increase">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M5.6 3.6L9.9 8l-4.3 4.4.7.7L11.3 8l-5-5.1-.7.7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item" id="menuAllModelsToggle">
                        <div class="menu-item-title">All Models</div>
                        <div class="menu-item-desc">Show all available models.</div>
                    </div>

                    <div class="menu-item" id="menuStatefulToggle">
                        <div class="menu-item-title">Stateful</div>
                        <div class="menu-item-desc">Server-side context management.</div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item disabled" id="menuChatKeyBtn">
                        Set API Key
                    </div>

                    <div class="inlineAPIKeyContainer hidden" id="chatKeyContainer">
                        <input type="password" id="chatKeyInput" placeholder="sk-..." autocomplete="off">
                        <button id="chatKeySaveBtn" class="send-btn">Save</button>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item clear-chat-item" id="menuClearChatBtn">
                        <div class="menu-item-title" style="color: var(--vscode-errorForeground);">Clear Chat</div>
                        <button id="clearChatConfirmBtn" class="icon-btn hidden" title="Confirm Clear"
                            style="color: var(--vscode-errorForeground); border: 1px solid var(--vscode-errorForeground);">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                                <path fill-rule="evenodd" clip-rule="evenodd"
                                    d="M10 3h3v1h-1v9l-1 1H4l-1-1V4H2V3h3V2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zM9 2H6v1h3V2zM4 13h7V4H4v9zm2-8H5v7h1V5zm1 0h1v7H7V5zm2 0h1v7H9V5z" />
                            </svg>
                            <span>Confirm</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="{{scriptUri}}"></script>
</body>

</html>
