<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Base Reset */
        body { 
            font-family: var(--vscode-font-family); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: var(--vscode-sideBar-background);
            color: var(--vscode-foreground);
        }

        /* --- CHAT HISTORY AREA --- */
        .chat-container {
            flex: 1; 
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- UNIFIED INPUT BOX --- */
        .input-wrapper {
            padding: 10px;
            background: var(--vscode-sideBar-background);
        }
        .unified-box {
            display: flex;
            flex-direction: column;
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-input-border);
            border-radius: 12px; 
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .unified-box:focus-within {
            border-color: var(--vscode-focusBorder);
        }

        textarea { 
            width: 100%; 
            box-sizing: border-box; 
            background: transparent; 
            color: var(--vscode-input-foreground); 
            border: none; 
            outline: none; 
            resize: none; /* Disable the manual drag handle */
            min-height: 20px; /* Base height for a single line */
            max-height: 150px; /* The "sensible limit" before scrolling starts */
            overflow-y: auto; /* Only show scrollbar when max-height is reached */
            font-family: inherit;
            font-size: 13px;
            line-height: 1.5; /* Gives breathing room between wrapped lines */
            padding: 0;
            margin-bottom: 8px; 
        }
        
        /* The hidden API key box inside the unified box */
        .api-key-container { 
            display: none; 
            flex-direction: column; 
            gap: 6px; 
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--vscode-widget-border);
        }
        .api-key-container.visible { display: flex; }
        .api-key-row { display: flex; gap: 6px; }
        input[type="password"] { 
            flex: 1; 
            background: var(--vscode-editor-background); 
            color: var(--vscode-input-foreground); 
            border: 1px solid var(--vscode-input-border); 
            padding: 4px 6px; 
            outline: none; 
            border-radius: 4px; 
        }

        /* --- BOTTOM ACTION BAR --- */
        .box-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .minimal-select {
            /* Strip the default OS styling */
            appearance: none;
            -webkit-appearance: none;
            
            /* Modern Pill styling */
            background:transparent;
            color: var(--vscode-foreground);
            border: 1px solid var(--vscode-input-border);
            border-radius: 12px; 
            padding: 4px 22px 4px 10px; /* Extra padding on the right for the arrow */
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            max-width: 115px; 
            text-overflow: ellipsis;
            white-space: nowrap;
            
            /* Custom SVG Chevron injected directly via CSS */
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 8px auto;
            
            transition: border-color 0.2s, background-color 0.2s;
        }
        
        .minimal-select:hover:not(:disabled) {
            background-color: var(--vscode-dropdown-background);
            border-color: var(--vscode-focusBorder);
        }

        .minimal-select:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
            box-shadow: 0 0 0 1px var(--vscode-focusBorder);
        }

        .minimal-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-image: none; /* Hide arrow when disabled to look cleaner */
        }

        /* Buttons */
        .icon-btn {
            background: transparent;
            color: var(--vscode-icon-foreground);
            border: none;
            border-radius: 4px;
            padding: 4px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover:not(:disabled) { background: var(--vscode-toolbar-hoverBackground); }
        .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .send-btn {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .send-btn:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            word-wrap: break-word;
            white-space: pre-wrap; /* This ensures line breaks in code stay intact! */
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.user {
            align-self: flex-end;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-bottom-right-radius: 2px; /* Gives it that chat-tail look */
        }

        .message.agent {
            align-self: flex-start;
            background: var(--vscode-editorWidget-background);
            border: 1px solid var(--vscode-widget-border);
            color: var(--vscode-foreground);
            border-bottom-left-radius: 2px;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 2px;
            height: 14px;
        }
        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--vscode-descriptionForeground);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        /* Stagger the animation delays so they wave */
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>
    
    <div class="chat-container" id="chatContainer"></div>

    <div class="input-wrapper">
        <div class="unified-box">
            
            <div id="apiKeyContainer" class="api-key-container">
                <label id="apiKeyLabel" style="font-size: 11px; font-weight: bold;"></label>
                <div class="api-key-row">
                    <input type="password" id="apiKeyInput" placeholder="sk-...">
                    <button id="saveKeyBtn" class="send-btn" style="padding: 4px 8px;">Save</button>
                </div>
            </div>

            <textarea id="prompt" rows="1" placeholder="Ask CodeAgent..."></textarea>
            
            <div class="box-actions">
                <div class="action-group">
                    <select id="providerSelect" class="minimal-select">
                        <option value="" disabled selected>Provider...</option>
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Gemini</option>
                    </select>
                    
                    <select id="modelSelect" class="minimal-select" disabled>
                        <option value="">Models...</option>
                    </select>

                    <button id="apiKeyBtn" class="icon-btn" title="Set API Key" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                    </button>
                </div>
                
                <button id="sendBtn" class="send-btn" disabled>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 8h5v7h4V8h5L8 1z"/></svg>
                </button>
            </div>
        </div>
    </div>
    <script>
        const vscode = acquireVsCodeApi();
        vscode.postMessage({ type: 'webviewReady' });

        const providerSelect = document.getElementById('providerSelect');
        const apiKeyBtn = document.getElementById('apiKeyBtn');
        const modelSelect = document.getElementById('modelSelect');
        const sendBtn = document.getElementById('sendBtn');
        const promptInput = document.getElementById('prompt');

        const apiKeyContainer = document.getElementById('apiKeyContainer');
        const apiKeyLabel = document.getElementById('apiKeyLabel');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');

        const chatContainer = document.getElementById('chatContainer');

        function fillModels(models, choice=null) {
            modelSelect.innerHTML = '';
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
            modelSelect.disabled = false;
            sendBtn.disabled = false;

            if (choice) modelSelect.value = choice;
        }
        
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);

            msgDiv.textContent = text;

            chatContainer.appendChild(msgDiv);
            scrollToTop()
        }

        function scrollToTop() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });}

        function showTypingIndicator() {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'agent');
            msgDiv.id = 'typingIndicator';

            msgDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            chatContainer.appendChild(msgDiv);
            scrollToTop();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        promptInput.addEventListener('input', function() {
            this.style.height = '20px';
            this.style.height = this.scrollHeight + 'px';
            sendBtn.disabled = this.value.trim() === '' || modelSelect.disabled;
        });

        // Changed provider
        providerSelect.addEventListener('change', (e) => {
            const provider = e.target.value;
            apiKeyBtn.disabled = false;
            modelSelect.innerHTML = '<option value="">Loading...</option>';
            modelSelect.disabled = true;
            sendBtn.disabled = true;
            apiKeyContainer.classList.remove('visible');
            
            vscode.postMessage({ type: 'fetchModels', provider: provider });
        });


        // Opens window with text box to enter API key
        apiKeyBtn.addEventListener('click', () => {
            const provider = providerSelect.value;
            if (provider) {
                apiKeyLabel.innerText = `Update ${provider} API Key:`;
                apiKeyInput.value = '';
                apiKeyContainer.classList.add('visible');
                apiKeyInput.focus();
            }
        });

        // Update or create API key store
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            const provider = providerSelect.value;
            if (key && provider) {
                modelSelect.innerHTML = '<option value=""> Verfiying...</option>';
                apiKeyContainer.classList.remove('visible');
                vscode.postMessage({ type: 'saveApiKey', provider: provider, key: key});
            }
        });

        // Update model selection store
        modelSelect.addEventListener('change', (e) => {
            vscode.postMessage({ type: 'saveModelPreference', model: e.target.value});
        })

        // Listen for TS events
        window.addEventListener('message', event => {
            const message = event.data;
            
            // On restart, restore provider and model choice from last session
            if  (message.type === 'restoreState') {
                if (message.provider) {
                    providerSelect.value = message.provider;
                    apiKeyBtn.disabled = false;
                }
                if (message.models && message.models.length > 0) fillModels(message.models, message.model)
            }
            
            // Selected Provider with no set API key, request user input API Key
            else if (message.type === 'requestApiKey') {
                apiKeyLabel.innerText = `Enter ${message.provider} API key:`;
                modelSelect.innerHTML = '<option value="">Waiting for key...</option>';
                apiKeyInput.value='';
                apiKeyContainer.classList.add('visible');
                apiKeyInput.focus();
            }

            // Fill out drop down with available models
            else if (message.type === 'setModels') {
                fillModels(message.models)
                apiKeyContainer.classList.remove('visible');
            } 
            
            // Add agent response to chat window
            else if (message.type === 'receiveMessage') {
                removeTypingIndicator();
                appendMessage('agent', message.text);
            }

            // Something went wrong 
            else if (message.type === 'error') {
                modelSelect.innerHTML = '<option value="">Error</option>';
            }
        })

        // Send prompt to provider
        sendBtn.addEventListener('click', () => {
            const text = promptInput.value;
            const provider = providerSelect.value;
            const model = modelSelect.value;

            if (text && provider && model) {
                appendMessage('user', text);

                showTypingIndicator();
                vscode.postMessage({ type: 'askAgent', provider: provider, model: model, value: text});

                promptInput.value = '';
                promptInput.style.height = '20px';
                sendBtn.disabled = true;
            }
        });
    </script>
</body>

</html>
