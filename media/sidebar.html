<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    
    <div class="chat-container" id="chatContainer"></div>

    <div class="input-wrapper">
        <div class="unified-box">
            
            <div id="apiKeyContainer" class="api-key-container">
                <label id="apiKeyLabel" style="font-size: 11px; font-weight: bold;"></label>
                <div class="api-key-row">
                    <input type="password" id="apiKeyInput" placeholder="sk-...">
                    <button id="saveKeyBtn" class="send-btn" style="padding: 4px 8px;">Save</button>
                </div>
            </div>

            <textarea id="prompt" rows="1" placeholder="Ask CodeAgent..."></textarea>
            
            <div class="box-actions">
                <div class="action-group">
                    <select id="providerSelect" class="minimal-select">
                        <option value="" disabled selected>Provider...</option>
                        <option value="openai">OpenAI</option>
                        <option value="gemini">Gemini</option>
                    </select>
                    
                    <select id="modelSelect" class="minimal-select" disabled>
                        <option value="">Models...</option>
                    </select>

                    <button id="apiKeyBtn" class="icon-btn" title="Set API Key" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                        </svg>
                    </button>
                </div>
                
                <button id="sendBtn" class="send-btn" disabled>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 8h5v7h4V8h5L8 1z"/></svg>
                </button>
            </div>
        </div>
    </div>
    <script>
        const vscode = acquireVsCodeApi();
        vscode.postMessage({ type: 'webviewReady' });

        const providerSelect = document.getElementById('providerSelect');
        const apiKeyBtn = document.getElementById('apiKeyBtn');
        const modelSelect = document.getElementById('modelSelect');
        const sendBtn = document.getElementById('sendBtn');
        const promptInput = document.getElementById('prompt');

        const apiKeyContainer = document.getElementById('apiKeyContainer');
        const apiKeyLabel = document.getElementById('apiKeyLabel');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveKeyBtn = document.getElementById('saveKeyBtn');

        const chatContainer = document.getElementById('chatContainer');

        let activeToolGroup = null;
        let activeToolSummary = null;
        let activeToolLogs = null;
        let activeTool = null;
        let toolErrorCount = 0;

        function formatToolArgs(args) {
            try {
                const parsed = typeof args === 'string' ? JSON.parse(args) : args;

                if (!parsed || Object.keys(parsed).length ===  0) return '';

                let html = '<div class="arg-block">';
                for (const [key, value] of Object.entries(parsed)) {
                    let displayValue = '';

                    if (typeof value === 'string' && value.includes('\n')) {
                        const safeValue = value.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        displayValue = `<div class="arg-multiline">${safeValue}</div>`;
                    } else {
                        displayValue = `<span class="arg-string">"${value}"</span>`;
                    }
                    html += `<div class="arg-row"><span class="arg-key">${key}:</span> ${displayValue}</div>`;
                }
                html += '</div>';
                return html;
            } catch (e) {
                // fallback to unformatted string
                return `<span style="opacity: 0.8; margin-left: 6px;">(${JSON.stringify(args)})</span>`;
            }
        }

        // Convert agent's text response in proper markdown
        function parseMarkdown(text) {
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Parse Code Blocks (```language ... ```)
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, language, code) {
                return `<pre class="md-code-block"><code>${code}</code></pre>`;
            });

            // Parse Inline Code (`code`)
            html = html.replace(/`([^`]+)`/g, '<code class="md-inline-code">$1</code>');

            // Parse Bold (**text**)
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="md-bold">$1</strong>');

            // Parse Italic (*text*)
            html = html.replace(/\*([^*]+)\*/g, '<em class="md-italic">$1</em>');

            // Parse Links [text](url)
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="md-link" target="_blank">$1</a>');

            return html;
        }


        // After receiving valid api key, fetch all available models and fill out drop down
        function fillModels(models, choice=null) {
            modelSelect.innerHTML = '';
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });
            modelSelect.disabled = false;
            sendBtn.disabled = false;

            if (choice) modelSelect.value = choice;
        }
        
        // Add text bubbles from user prompts or agent reponses
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', role);

            if (role === 'agent') msgDiv.innerHTML = parseMarkdown(text);
            else msgDiv.textContent = text;

            if (role === 'agent') {
                msgDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            }

            chatContainer.appendChild(msgDiv);
            scrollToTop()
        }

        function scrollToTop() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });}

        // Loading animation whilst waiting
        function showTypingIndicator() {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', 'agent');
            msgDiv.id = 'typingIndicator';

            msgDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            chatContainer.appendChild(msgDiv);
            scrollToTop();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Create a new tool group which contains information on what tools are running
        function makeCurrentToolGroup(message) {
            removeTypingIndicator();
            activeToolGroup = document.createElement('details');
            activeToolGroup.classList.add('tool-group');

            activeToolSummary = document.createElement('summary');
            activeToolSummary.innerHTML = `<div class="vscode-spinner"></div> Initializing tools...`;

            activeToolLogs = document.createElement('div');
            activeToolLogs.classList.add('tool-logs');

            activeToolGroup.appendChild(activeToolSummary);
            activeToolGroup.appendChild(activeToolLogs);
            chatContainer.appendChild(activeToolGroup);
            scrollToTop();
        }

        // Add detail section for running tool and finished tool
        function updateCurrentToolGroup(message) {
            if (!activeToolGroup) return;

            if (message.status === 'running') {
                if (activeToolSummary) {
                    activeToolSummary.innerHTML = `<div class="vscode-spinner"></div> Running <b>${message.toolName}</b>...`;
                }
                activeTool = document.createElement('div');
                activeTool.classList.add('tool-log-entry');

                const displayArgs = formatToolArgs(message.args);

                activeTool.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <span class="tool-icon log-running" style="margin-right: 4px;">⏳</span> 
                        <b>${message.toolName}</b>
                    </div>
                    ${displayArgs}
                `;
                activeToolLogs.appendChild(activeTool);
            }
            else if (message.status === 'success') {
                if (activeTool) {
                    const icon = activeTool.querySelector('.tool-icon');
                    if (icon){
                        icon.className = 'tool-icon log-success';
                        icon.textContent = '✔';
                    }
                }
            }
            else if (message.status === 'error') {
                toolErrorCount++;
                if (activeTool) {
                    activeTool.classList.add('log-error');
                    const icon = activeTool.querySelector('.tool-icon');
                    if (icon) {
                        icon.className = 'tool-icon log-error';
                        icon.textContent = '✖'
                    }
                    activeTool.innerHTML += `<div style="margin-left: 18px; margin-top: 4px; opacity: 0.9;">${message.error}</div>`;
                }
            }

            scrollToTop();
        }

        // Tool calls completed
        function endCurrentToolGroup(message) {
            if (!activeToolGroup) return;

            if (toolErrorCount > 0) activeToolSummary.textContent = `⚠️ Completed with ${toolErrorCount} error(s)`;
            else activeToolSummary.textContent = `✅ ${message.totalCount} tool(s) executed successfully`;
            
            activeToolGroup = null;
            activeToolSummary = null;
            activeToolLogs = null;
            activeTool = null;
            toolErrorCount = 0;
        }

        // Adjust the size of the input box based on prompt length
        promptInput.addEventListener('input', function() {
            this.style.height = '20px';
            this.style.height = this.scrollHeight + 'px';
            sendBtn.disabled = this.value.trim() === '' || modelSelect.disabled;
        });

        // Changed provider
        providerSelect.addEventListener('change', (e) => {
            const provider = e.target.value;
            apiKeyBtn.disabled = false;
            modelSelect.innerHTML = '<option value="">Loading...</option>';
            modelSelect.disabled = true;
            sendBtn.disabled = true;
            apiKeyContainer.classList.remove('visible');
            
            vscode.postMessage({ type: 'fetchModels', provider: provider });
        });


        // Opens window with text box to enter API key
        apiKeyBtn.addEventListener('click', () => {
            const provider = providerSelect.value;
            if (provider) {
                apiKeyLabel.innerText = `Update ${provider} API Key:`;
                apiKeyInput.value = '';
                apiKeyContainer.classList.add('visible');
                apiKeyInput.focus();
            }
        });

        // Update or create API key store
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            const provider = providerSelect.value;
            if (key && provider) {
                modelSelect.innerHTML = '<option value=""> Verfiying...</option>';
                apiKeyContainer.classList.remove('visible');
                vscode.postMessage({ type: 'saveApiKey', provider: provider, key: key});
            }
        });

        // Update model selection store
        modelSelect.addEventListener('change', (e) => {
            vscode.postMessage({ type: 'saveModelPreference', model: e.target.value});
        })

        // Listen for backend events
        window.addEventListener('message', event => {
            const message = event.data;
            
            // On restart, restore provider and model choice from last session
            if  (message.type === 'restoreState') {
                if (message.provider) {
                    providerSelect.value = message.provider;
                    apiKeyBtn.disabled = false;
                }
                if (message.models && message.models.length > 0) fillModels(message.models, message.model)
            }
            
            // Selected Provider with no set API key, request user input API Key
            else if (message.type === 'requestApiKey') {
                apiKeyLabel.innerText = `Enter ${message.provider} API key:`;
                modelSelect.innerHTML = '<option value="">Waiting for key...</option>';
                apiKeyInput.value='';
                apiKeyContainer.classList.add('visible');
                apiKeyInput.focus();
            }

            // Fill out drop down with available models
            else if (message.type === 'setModels') {
                fillModels(message.models)
                apiKeyContainer.classList.remove('visible');
            } 
            
            // Add agent response to chat window
            else if (message.type === 'receiveMessage') {
                removeTypingIndicator();
                appendMessage('agent', message.text);
            }

            else if (message.type === 'startToolGroup') makeCurrentToolGroup(message)

            else if (message.type === 'updateTool') updateCurrentToolGroup(message);

            else if (message.type === 'endToolGroup') endCurrentToolGroup(message);
            
            // Something went wrong 
            else if (message.type === 'error') modelSelect.innerHTML = '<option value="">Error</option>';
            
        })

        // Send prompt to provider
        sendBtn.addEventListener('click', () => {
            const text = promptInput.value;
            const provider = providerSelect.value;
            const model = modelSelect.value;

            if (text && provider && model) {
                appendMessage('user', text);

                showTypingIndicator();
                vscode.postMessage({ type: 'askAgent', provider: provider, model: model, value: text});

                promptInput.value = '';
                promptInput.style.height = '20px';
                sendBtn.disabled = true;
            }
        });
    </script>
</body>

</html>
