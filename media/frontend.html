<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{styleUri}}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div class="chat-header">
        <div class="header-left">
            <button id="indexBtn" class="header-action-btn" title="Workspace Indexing">
                <span id="indexDot" class="status-dot disabled"></span>
                <span>Index</span>
            </button>
        </div>

        <button id="clearChatBtn" class="icon-btn" title="Clear Chat History">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd"
                    d="M10 3h3v1h-1v9l-1 1H4l-1-1V4H2V3h3V2a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1zM9 2H6v1h3V2zM4 13h7V4H4v9zm2-8H5v7h1V5zm1 0h1v7H7V5zm2 0h1v7H9V5z" />
            </svg>
        </button>

        <div id="indexPanel" class="floating-index index-panel">
            <div class="panel-title">Workspace Indexing</div>

            <label class="index-toggle">
                <input type="checkbox" id="indexToggle">
                <span>Enable indexing</span>
            </label>

            <div class="api-key-row">
                <select id="embedProviderSelect" class="dropdown-select">
                    <option value="" disabled selected>Provider...</option>
                </select>

                <select id="embedModelSelect" class="dropdown-select" disabled>
                    <option value="">Models...</option>
                </select>

                <button id="embedAPIKeyBtn" class="icon-btn" title="Set Embedding API Key" disabled>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4">
                        </path>
                    </svg>
                </button>
            </div>

            <div id="embedAPIKeyContainer" class="api-key-container header-api-key-container">
                <label id="embedAPIKeyLabel" style="font-size: 11px; font-weight: bold;"></label>
                <div class="api-key-row">
                    <input type="password" id="embedAPIKeyInput" placeholder="API key...">
                    <button id="embedSaveKeyBtn" class="send-btn" style="padding: 4px 8px;">Save</button>
                </div>
            </div>

            <div class="index-footer">
                <button id="indexWorkspaceBtn" class="send-btn" disabled>Index Workspace</button>
                <span id="indexStatus" class="index-status">Disabled</span>
            </div>
        </div>

        <div id="clearConfirmContainer" class="floating-confirm">
            <label
                style="font-size: 11px; font-weight: bold; text-align: center; color: var(--vscode-foreground);">Clear
                all history?</label>
            <div class="api-key-row">
                <button id="cancelClearBtn" class="send-btn"
                    style="flex: 1; background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); justify-content: center;">Cancel</button>
                <button id="confirmClearBtn" class="send-btn"
                    style="flex: 1; background: var(--vscode-errorForeground); color: white; justify-content: center;">Clear</button>
            </div>
        </div>
    </div>
    <div class="chat-container" id="chatContainer"></div>

    <button id="scrollToBottomBtn" class="scroll-bottom-btn" title="Scroll to bottom">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M8 11L3 6l.7-.7L8 9.6l4.3-4.3.7.7L8 11z" />
        </svg>
    </button>

    <div class="chat-input">
        <div class="unified-box">

            <div class="input-row">
                <textarea id="prompt" rows="1" placeholder="Select Provider..."></textarea>
                <button id="sendBtn" class="send-btn" disabled>
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 1L1 8h5v7h4V8h5L8 1z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="box-actions">
            <div class="action-group">
                <div class="custom-dropdown" id="providerDropdown">
                    <button class="dropdown-trigger provider-op" type="button" id="providerTrigger">
                        <span class="selected-text">Provider...</span>
                    </button>
                    <div class="dropdown-list hidden" id="providerList"></div>
                </div>

                <span class="divider">|</span>

                <div class="custom-dropdown" id="modelDropdown">
                    <button class="dropdown-trigger model-op" type="button" id="modelTrigger" disabled>
                        <span class="selected-text">Models...</span>
                    </button>
                    <div class="dropdown-list hidden" id="modelList"></div>
                </div>

                <span class="divider hidden" id="effortDivider">|</span>

                <div class="custom-dropdown effort-dropdown hidden" id="effortDropdown">
                    <button class="dropdown-trigger effort-op" type="button" id="effortTrigger">
                        <span class="selected-text">Effort</span>
                    </button>
                    <div class="dropdown-list hidden" id="effortList"></div>
                </div>
            </div>
            <div class="settings-menu-wrapper" id="settingsMenuContainer">
                <button id="chatSettingsToggleBtn" class="icon-btn" title="Model Settings">Settings</button>


                <div class="dropdown-list hidden" id="settingsDropdownList">
                    <div class="menu-item" id="menuMaxTurns"
                        style="cursor: default; display: flex; align-items: center; justify-content: space-between;">
                        <div class="menu-item-text">
                            <div class="menu-item-title">Max turns</div>
                            <div class="menu-item-desc">Set 0 to disable turn limit.</div>
                        </div>

                        <div class="number-control" id="maxTurnsControl">
                            <button type="button" id="maxTurnsMinus" class="icon-btn" title="Decrease">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M10.4 12.4L6.1 8l4.3-4.4-.7-.7L4.7 8l5 5.1.7-.7z" />
                                </svg>
                            </button>
                            <input type="number" id="maxTurnsInput" value="0" min="0">
                            <button type="button" id="maxTurnsPlus" class="icon-btn" title="Increase">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                    <path fill-rule="evenodd" clip-rule="evenodd"
                                        d="M5.6 3.6L9.9 8l-4.3 4.4.7.7L11.3 8l-5-5.1-.7.7z" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item" id="menuAllModelsToggle">
                        <div class="menu-item-title">All Models</div>
                        <div class="menu-item-desc">Show all available models.</div>
                    </div>

                    <div class="menu-item" id="menuStatefulToggle">
                        <div class="menu-item-title">Stateful</div>
                        <div class="menu-item-desc">Server-side context management.</div>
                    </div>

                    <div class="menu-divider"></div>

                    <div class="menu-item disabled" id="menuAPIKeyBtn">
                        Set API Key
                    </div>

                    <div id="inlineAPIKeyContainer" class="hidden">
                        <input type="password" id="chatAPIKeyInput" placeholder="sk-..." autocomplete="off">
                        <button id="chatSaveKeyBtn" class="send-btn">Save</button>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="{{scriptUri}}"></script>
</body>

</html>
